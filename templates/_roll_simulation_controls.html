<div id="{{ roll_prefix }}PlaySelection" class="roll-control-grid play-selection-controls" hidden>
    <label for="{{ roll_prefix }}SelectionMode">投注方向
        <select id="{{ roll_prefix }}SelectionMode" class="home-select">
            <option value="follow">跟随方案预测</option><option value="fixed">固定买所选方向</option>
            <option value="filter">只跟预测的所选方向</option>
        </select>
    </label>
    <label for="{{ roll_prefix }}FixedValue" hidden>固定／筛选方向
        <select id="{{ roll_prefix }}FixedValue" class="home-select"></select>
    </label>
</div>
<fieldset id="{{ roll_prefix }}RollControls" class="roll-controls" hidden>
    <legend>过关设置</legend>
    <div class="roll-control-grid">
        <label for="{{ roll_prefix }}RollStructure">投注结构
            <select id="{{ roll_prefix }}RollStructure" class="home-select" data-roll-key="structure">
                <option value="single_play">当前所选玩法过关</option>
                <option value="follow_signal">旧七三分注：跟随组合预测</option>
                <option value="A">固定：单＋小双</option><option value="B">固定：单＋大双</option>
                <option value="C">固定：双＋小单</option><option value="D">固定：双＋大单</option>
            </select>
        </label>
        <label for="{{ roll_prefix }}RollMode">滚动方式
            <select id="{{ roll_prefix }}RollMode" class="home-select" data-roll-key="roll_mode">
                <option value="chain">链条：滚动本期返还</option><option value="all_in">全仓：滚动可用余额</option>
            </select>
        </label>
        <label for="{{ roll_prefix }}RollBase">每轮起始金额（U）
            <input id="{{ roll_prefix }}RollBase" class="home-select" data-roll-key="base_amount" type="number" min="1" max="1000000" step="0.01" value="100" required>
        </label>
        <label for="{{ roll_prefix }}RollShare">主注占比（%）
            <input id="{{ roll_prefix }}RollShare" class="home-select" data-roll-key="main_share" type="number" min="1" max="99" step="0.01" value="70" required>
        </label>
        <label for="{{ roll_prefix }}RollTarget">目标连赢关数
            <input id="{{ roll_prefix }}RollTarget" class="home-select" data-roll-key="target_streak" type="number" min="1" max="100" step="1" value="3" required>
        </label>
        <label for="{{ roll_prefix }}RollDays">回放区间
            <select id="{{ roll_prefix }}RollDays" class="home-select" data-roll-key="days">
                <option value="1">当前日</option><option value="7">近 7 日</option><option value="30">近 30 日</option>
            </select>
        </label>
        <label for="{{ roll_prefix }}RollBoundary">每日重置时间
            <select id="{{ roll_prefix }}RollBoundary" class="home-select" data-roll-key="day_boundary">
                <option value="natural">北京时间 00:00</option><option value="pc28">PC28 盘日 20:00／21:00</option>
            </select>
        </label>
        <label for="{{ roll_prefix }}RollOnTarget">达标后
            <select id="{{ roll_prefix }}RollOnTarget" class="home-select" data-roll-key="on_target">
                <option value="close_day">当天收工</option><option value="new_cycle">下一有效期开新轮</option>
            </select>
        </label>
        <label for="{{ roll_prefix }}RollOnBust">资金不足后
            <select id="{{ roll_prefix }}RollOnBust" class="home-select" data-roll-key="on_bust">
                <option value="close_day">当天收工</option><option value="new_cycle">补足起始金额再开轮</option>
            </select>
        </label>
        <label for="{{ roll_prefix }}RollMaxCycles">每天最多轮数（含首轮）
            <input id="{{ roll_prefix }}RollMaxCycles" class="home-select" data-roll-key="max_cycles_per_day" type="number" min="1" max="1000" step="1" value="1" required>
        </label>
    </div>
    <p class="roll-control-help">整期盈利加一关，亏损清零，持平保持。起始金额为整期总额，组玩法等分为整数子注，尾差留仓；补入本金不计作收益。不同玩法分别模拟，各自独立过关。</p>
</fieldset>
